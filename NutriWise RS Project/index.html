const STORE='nutriwise-preview-v1';let state={};try{state=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){};function save(){localStorage.setItem(STORE,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function val(id){return document.getElementById(id)?.value||''}function num(id){return Number(val(id)||0)}function pageName(){return location.hash.slice(1)||'home'}function go(p){location.hash=p}function setNav(){document.getElementById('nav').innerHTML=pages.map(([id,label])=>`<button class="${pageName()===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}
function card(title,desc,btn,pg,tag){return `<article class="card"><span class="pill">${tag}</span><h3>${title}</h3><p>${desc}</p><button class="btn secondary" onclick="go('${pg}')">${btn} →</button></article>`}
function home(){return `<section class="hero"><div><div class="eyebrow">A calmer way to eat well</div><h1>Your nutrition plan, organised around <span style="color:var(--green)">your life.</span></h1><p>Explore 100 vegetarian and non-vegetarian meal plans, calculate a daily calorie goal, organise meals, and keep your progress in one simple workspace.</p><div class="actions"><button class="btn" onclick="go('plans')">Explore 100 plans →</button><button class="btn secondary" onclick="go('calculator')">Calculate calories</button></div></div><div class="heroart"><span class="emoji">🥗 🍲 🍎</span><strong>Small, consistent choices add up.</strong><span>Plan · Track · Adjust</span></div></section><section class="section"><div class="sectionhead"><div><h2>Your nutrition workspace</h2><p>Each tool has its own section. Choose one to get started.</p></div></div><div class="grid">${card('100 diet plans','Browse 50 vegetarian and 50 non-vegetarian plans with meal ideas and estimated calories and protein.','Browse plans','plans','01 · Discover')}${card('Meal planner','Save your calorie goal and organise meals for the day.','Open planner','planner','02 · Personalise')}${card('Calorie calculator','Estimate BMR and daily energy needs, then choose your target.','Calculate now','calculator','03 · Calculate')}${card('Food diary','Log foods and calories and compare intake with your goal.','Open diary','diary','04 · Track')}${card('Recipe ideas','Explore easy vegetarian and non-vegetarian meal inspiration.','Explore recipes','recipes','05 · Get inspired')}${card('Progress & groceries','Record weight trends and make a shopping checklist.','Open tools','progress','06 · Stay consistent')}</div></section><section class="section"><div class="card"><div class="eyebrow">A useful reminder</div><h2>Choose a plan that fits you, not the other way around.</h2><p class="muted">Calorie and protein figures are estimates. Your needs depend on age, body size, activity, health and goals. Adjust portions and seek a registered dietitian for medical or therapeutic diets.</p></div></section>`}
function plansPage(){return `<section class="section"><div class="sectionhead"><div><div class="eyebrow">Find your fit</div><h2>100 diet plans</h2><p>Filter meal ideas by diet type, goal, calories or protein.</p></div><span class="pill" id="count">100 plans</span></div><div class="toolbar"><input id="search" placeholder="Search meals, ingredients or plan name…" oninput="renderPlanCards()"><select id="diet" onchange="renderPlanCards()"><option>All diets</option><option>Vegetarian</option><option>Non-vegetarian</option></select><select id="goal" onchange="renderPlanCards()"><option>All goals</option><option>Balanced</option><option>Higher protein</option><option>Active lifestyle</option><option>Budget-friendly</option><option>Muscle support</option></select><select id="sort" onchange="renderPlanCards()"><option value="default">Recommended order</option><option value="calories">Calories: low to high</option><option value="protein">Protein: high to low</option></select></div><div class="grid" id="plansGrid"></div></section>`}
function renderPlanCards(){const root=document.getElementById('plansGrid');if(!root)return;const q=val('search').toLowerCase(),diet=val('diet'),goal=val('goal'),sort=val('sort');let a=plans.filter(p=>(diet==='All diets'||p.diet===diet)&&(goal==='All goals'||p.goal===goal)&&[p.name,p.breakfast,p.lunch,p.snack,p.dinner].join(' ').toLowerCase().includes(q));if(sort==='calories')a.sort((x,y)=>x.calories-y.calories);if(sort==='protein')a.sort((x,y)=>y.protein-x.protein);document.getElementById('count').textContent=`Showing ${a.length} of 100`;root.innerHTML=a.length?a.map(p=>`<article class="card plan-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="pill">${p.diet}</span><button class="btn secondary" style="padding:5px 9px" onclick="toggleFav(${p.id})">${(state.favourites||[]).includes(p.id)?'★ Saved':'☆ Save'}</button></div><h3>${esc(p.name)}</h3><div class="stats"><div class="stat"><small>Calories</small><strong>${p.calories}</strong><small>kcal/day</small></div><div class="stat"><small>Protein</small><strong>${p.protein}g</strong><small>estimated/day</small></div></div><div class="meals"><div class="meal"><b>Breakfast</b>${esc(p.breakfast)}</div><div class="meal"><b>Lunch</b>${esc(p.lunch)}</div><div class="meal"><b>Snack</b>${esc(p.snack)}</div><div class="meal"><b>Dinner</b>${esc(p.dinner)}</div></div><div class="small">${esc(p.note)}</div><div class="actions"><button class="btn" onclick="usePlan(${p.id})">Use this plan</button></div></article>`).join(''):'<div class="empty">No plans match those filters. Try a different search.</div>'}
function toggleFav(id){state.favourites=state.favourites||[];state.favourites=state.favourites.includes(id)?state.favourites.filter(x=>x!==id):[...state.favourites,id];save();renderPlanCards()}function usePlan(id){const p=plans.find(x=>x.id===id);state.activePlan=p;state.target=p.calories;state.planMeals={Breakfast:p.breakfast,Lunch:p.lunch,Snack:p.snack,Dinner:p.dinner};save();alert('Plan saved! Open Meal Planner to review it.');}
function calculator(){return `<section class="section"><div class="eyebrow">Personalise your target</div><h2>Calorie calculator</h2><p class="muted">Uses the Mifflin–St Jeor equation to estimate resting energy and daily needs.</p><div class="grid two"><div class="card"><div class="formgrid"><div class="field"><label>Age (years)</label><input id="age" type="number" min="15" max="100" value="${state.profile?.age||20}"></div><div class="field"><label>gender coefficient</label><select id="gender"><option value="male">Male</option><option value="female">Female</option><option value="neutral">Neutral estimate</option></select></div><div class="field"><label>Height (cm)</label><input id="height" type="number" value="${state.profile?.height||177}"></div><div class="field"><label>Weight (kg)</label><input id="weight" type="number" value="${state.profile?.weight||65}"></div></div><div class="field"><label>Activity level</label><select id="activity"><option value="1.2">Mostly sitting / little exercise</option><option value="1.375">Light activity (1–3 days/week)</option><option value="1.55">Moderate activity (3–5 days/week)</option><option value="1.725">Very active (6–7 days/week)</option><option value="1.9">Extremely active / physical work</option></select></div><div class="field"><label>Goal</label><select id="calGoal"><option value="maintain">Maintain weight</option><option value="gain">Gain gradually (+250 kcal)</option><option value="loss">Lose gradually (−250 kcal)</option></select></div><div class="actions"><button class="btn" onclick="calculate()">Calculate my target</button><button class="btn secondary" onclick="usePlannerProfile()">Use planner details</button></div></div><div class="card"><div class="eyebrow">Your estimate</div><div class="stats"><div class="stat"><small>BMR</small><strong id="bmr">—</strong><small>kcal/day</small></div><div class="stat"><small>Maintenance</small><strong id="tdee">—</strong><small>kcal/day</small></div><div class="stat"><small>Goal target</small><strong id="suggested">—</strong><small>kcal/day</small></div></div><p class="muted" id="calcNote">Enter your details and calculate to see an estimate.</p><div class="notice">This is an estimate, not a medical prescription. Avoid aggressive calorie restriction; if under 18, pregnant, or managing a medical condition, ask a qualified professional.</div></div></div><div class="card" style="margin-top:16px"><h3>Set your daily calorie goal</h3><p class="muted">You can change this target any time. It is used by the diary and planner.</p><div class="toolbar"><input id="targetInput" type="number" min="800" max="6000" value="${state.target||2000}" aria-label="Daily calorie target"><button class="btn secondary" onclick="adjustTarget(-250)">−250</button><button class="btn secondary" onclick="adjustTarget(-100)">−100</button><button class="btn secondary" onclick="adjustTarget(100)">+100</button><button class="btn secondary" onclick="adjustTarget(250)">+250</button><button class="btn" onclick="saveTarget()">Save goal</button></div><p class="small" id="targetMsg"></p></div></section>`}
function calculate(){let age=num('age'),h=num('height'),w=num('weight'),gender=val('gender'),activity=num('activity');if(age<15||h<=0||w<=0){document.getElementById('calcNote').textContent='Please enter valid age, height and weight.';return}let bmr=10*w+6.25*h-5*age+(gender==='male'?5:gender==='female'?-161:-78),tdee=bmr*activity,g=val('calGoal'),target=Math.max(1200,Math.round(tdee+(g==='gain'?250:g==='loss'?-250:0)));document.getElementById('bmr').textContent=Math.round(bmr).toLocaleString();document.getElementById('tdee').textContent=Math.round(tdee).toLocaleString();document.getElementById('suggested').textContent=target.toLocaleString();document.getElementById('calcNote').textContent='Estimate only. Real needs can vary with body composition, health, and activity.';document.getElementById('targetInput').value=target;state.profile={age,height:h,weight:w,gender,activity};state.suggested=target;save()}
function adjustTarget(n){document.getElementById('targetInput').value=Math.max(800,Math.min(6000,num('targetInput')+n))}function saveTarget(){state.target=Math.max(800,Math.min(6000,num('targetInput')));save();const m=document.getElementById('targetMsg');if(m)m.textContent=`Saved daily target: ${state.target} kcal. Your diary will use this goal.`}function usePlannerProfile(){let p=state.profile||{};if(p.age)document.getElementById('age').value=p.age;if(p.height)document.getElementById('height').value=p.height;if(p.weight)document.getElementById('weight').value=p.weight;if(p.gender)document.getElementById('gender').value=p.gender;if(p.activity)document.getElementById('activity').value=p.activity}
function planner(){let m=state.planMeals||{},p=state.activePlan;return `<section class="section"><div class="eyebrow">Plan your day</div><h2>Meal planner</h2><p class="muted">Save a simple daily meal outline. A plan selected from the 100-plan library appears here.</p><div class="grid two"><div class="card"><div class="field"><label>Diet preference</label><select id="pref"><option>Vegetarian</option><option>Non-vegetarian</option><option>Vegan</option></select></div><div class="field"><label>Daily calorie goal (kcal)</label><input id="plannerTarget" type="number" value="${state.target||2000}"></div>${['Breakfast','Lunch','Snack','Dinner'].map(k=>`<div class="field"><label>${k}</label><input id="meal${k}" value="${esc(m[k]||'')}" placeholder="Add a meal idea"></div>`).join('')}<div class="actions"><button class="btn" onclick="savePlanner()">Save daily plan</button><button class="btn secondary" onclick="go('plans')">Choose from 100 plans</button></div></div><div class="card"><span class="pill">Your saved plan</span><h3>${p?esc(p.name):'No preset plan selected'}</h3><p>${p?`${p.calories} kcal · ${p.protein} g estimated protein`:'Browse diet plans and select “Use this plan” to start with a preset.'}</p><div class="notice">Keep portions appropriate for your appetite, activity and nutritional needs.</div></div></div></section>`}
function savePlanner(){state.target=Math.max(800,num('plannerTarget'));state.preference=val('pref');state.planMeals={Breakfast:val('mealBreakfast'),Lunch:val('mealLunch'),Snack:val('mealSnack'),Dinner:val('mealDinner')};save();alert('Your meal plan has been saved in this browser.')}function diary(){let entries=state.entries||[],sum=k=>entries.reduce((a,e)=>a+Number((e[k]||0)),0),total=sum('cal'),target=state.target||2000;const nutrients=[['Protein','protein','g'],['Carbs','carbs','g'],['Fat','fat','g'],['Fiber','fiber','g'],['Sugar','sugar','g'],['Saturated fat','satFat','g'],['Sodium','sodium','mg']];return `<section class="section"><div class="eyebrow">Everyday tracking</div><h2>Food diary</h2><p class="muted">Type a food name, choose a serving size, and look up nutrition data online. Calories and protein are highlighted; other nutrients are tracked too.</p><div class="grid two"><div class="card"><div class="stats"><div class="stat"><small>Calories logged</small><strong>${Math.round(total)}</strong><small>kcal today</small></div><div class="stat"><small>Protein logged</small><strong>${sum('protein').toFixed(1)}g</strong><small>priority nutrient</small></div><div class="stat"><small>Daily goal</small><strong>${target}</strong><small>kcal</small></div></div><div class="progress"><span style="width:${Math.min(100,total/target*100)}%"></span></div><p class="small">${Math.round(total/target*100)}% of your calorie goal logged</p><div class="formgrid"><div class="field"><label>Food name</label><input id="foodName" placeholder="e.g. paneer, banana, dal rice"></div><div class="field"><label>Portion size (grams)</label><input id="foodGrams" type="number" min="1" value="100" placeholder="100"></div></div><div class="actions"><button class="btn" onclick="searchFoodNutrition()">Search nutrition online</button><a class="btn secondary" target="_blank" rel="noopener" href="https://www.google.com/search?q=food+nutrition+facts">Google nutrition search</a></div><p class="small">Nutrition lookup uses Open Food Facts where available. Search Google for foods not found; cooked recipes and homemade portions can vary.</p><div id="foodLookup" aria-live="polite"></div><div id="foodPreview"></div></div><div class="card"><h3>Today's nutrition</h3><div class="stats"><div class="stat"><small>Calories</small><strong>${Math.round(total)} kcal</strong></div><div class="stat"><small>Protein</small><strong>${sum('protein').toFixed(1)} g</strong></div></div><div class="nutrient-grid">${nutrients.map(([label,key,unit])=>`<div class="nutrient"><span>${label}</span><strong>${sum(key).toFixed(1)} ${unit}</strong></div>`).join('')}</div><h3 style="margin-top:20px">Today's entries</h3>${entries.length?entries.map((e,i)=>`<div class="checkrow" style="align-items:flex-start"><span style="flex:1"><b>${esc(e.name)}</b><br><span class="small">${e.grams||100} g · ${Math.round(e.cal)} kcal · <b>${Number(e.protein||0).toFixed(1)} g protein</b><br>Carbs ${Number(e.carbs||0).toFixed(1)}g · Fat ${Number(e.fat||0).toFixed(1)}g · Fiber ${Number(e.fiber||0).toFixed(1)}g</span></span><button class="btn secondary" onclick="removeFood(${i})">Remove</button></div>`).join(''):'<p class="muted">No entries yet. Search for your first food.</p>'}<div class="actions"><button class="btn secondary" onclick="clearDiary()">Clear diary</button></div></div></div></section>`}
async function searchFoodNutrition(){const name=val('foodName').trim(),grams=Number(val('foodGrams')||100),box=document.getElementById('foodLookup');if(!name){alert('Type a food name first.');return}if(!(grams>0)){alert('Enter a portion size greater than 0 grams.');return}box.innerHTML='<p class="muted">Searching nutrition database…</p>';try{const url='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(name)+'&search_simple=1&action=process&json=1&page_size=8';const response=await fetch(url,{headers:{'Accept':'application/json'}});if(!response.ok)throw new Error('lookup failed');const data=await response.json();const products=(data.products||[]).filter(p=>p.product_name&&(p.nutriments?.['energy-kcal_100g']!=null||p.nutriments?.['energy-kcal']!=null||p.nutriments?.proteins_100g!=null));if(!products.length){box.innerHTML=`<p class="notice">No reliable match found for “${esc(name)}”. Try a simpler name or search <a target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(name+' nutrition calories protein carbs fat per 100g')}">Google for ${esc(name)} nutrition</a>. You can then enter a verified label-based estimate manually in a future version.</p>`;return}box.innerHTML='<p><b>Choose the closest match</b> (values are per 100 g in the database):</p>'+products.slice(0,6).map((p,i)=>`<button class="food-result" onclick="previewFoodResult(${i})"><b>${esc(p.product_name)}</b><br><span class="small">${esc(p.brands||p.categories||'Food database result')}</span></button>`).join('');window._foodSearchResults=products;}catch(err){box.innerHTML=`<p class="notice">The online nutrition database could not be reached. <a target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(name+' nutrition facts calories protein carbs fat')}">Search Google for ${esc(name)} nutrition facts</a>. Some foods, especially homemade Indian dishes, may need an approximate recipe-based estimate.</p>`}}
function previewFoodResult(index){const p=(window._foodSearchResults||[])[index];if(!p)return;const n=p.nutriments||{},get=(...keys)=>{for(const k of keys){const v=Number(n[k]);if(Number.isFinite(v)&&v>=0)return v}return 0};const base={cal:get('energy-kcal_100g','energy-kcal'),protein:get('proteins_100g','proteins'),carbs:get('carbohydrates_100g','carbohydrates'),fat:get('fat_100g','fat'),fiber:get('fiber_100g','fiber'),sugar:get('sugars_100g','sugars'),satFat:get('saturated-fat_100g','saturated-fat'),sodium:get('sodium_100g','sodium')*1000};const grams=Number(val('foodGrams')||100),scaled=Object.fromEntries(Object.entries(base).map(([k,v])=>[k,v*grams/100]));const el=document.getElementById('foodPreview');el.innerHTML=`<div class="card" style="margin-top:12px;background:var(--mint)"><h3>${esc(p.product_name)}</h3><p class="small">${esc(p.brands||'Nutrition database match')} · ${grams} g serving</p><div class="stats"><div class="stat"><small>Calories</small><strong>${Math.round(scaled.cal)} kcal</strong></div><div class="stat"><small>Protein</small><strong>${scaled.protein.toFixed(1)} g</strong></div></div><div class="nutrient-grid">${[['Carbs',scaled.carbs,'g'],['Fat',scaled.fat,'g'],['Fiber',scaled.fiber,'g'],['Sugar',scaled.sugar,'g'],['Saturated fat',scaled.satFat,'g'],['Sodium',scaled.sodium,'mg']].map(x=>`<div class="nutrient"><span>${x[0]}</span><strong>${x[1].toFixed(1)} ${x[2]}</strong></div>`).join('')}</div><p class="small">Values depend on the selected database entry and portion. Check packaging for branded foods.</p><button class="btn" onclick="confirmFoodAddEncoded('${encodeURIComponent(JSON.stringify({name:p.product_name,brand:p.brands||'',...base})).replace(/'/g,'%27')}')">Add ${grams} g to diary</button></div>`;}
function confirmFoodAddEncoded(encoded){try{confirmFoodAdd(JSON.parse(decodeURIComponent(encoded)))}catch(e){alert('Could not add this food. Please select it again.')}}
function confirmFoodAdd(food){const grams=Number(val('foodGrams')||100);if(!(grams>0))return;const factor=grams/100;state.entries=state.entries||[];state.entries.push({name:food.name+(food.brand?' ('+food.brand+')':''),grams,cal:food.cal*factor,protein:food.protein*factor,carbs:food.carbs*factor,fat:food.fat*factor,fiber:food.fiber*factor,sugar:food.sugar*factor,satFat:food.satFat*factor,sodium:food.sodium*factor,source:'Open Food Facts'});save();render();}
function addFood(){searchFoodNutrition()}function removeFood(i){state.entries.splice(i,1);save();render()}function clearDiary(){if(confirm('Clear all diary entries?')){state.entries=[];save();render()}}
const recipes=[['Paneer bhurji wrap','Vegetarian','Paneer, capsicum, onion and whole-wheat roti','Sauté paneer with spices and vegetables; wrap in a roti.'],['Rajma rice bowl','Vegetarian','Rajma, rice, cucumber and curd','Serve rajma with rice and a side of salad.'],['Chickpea salad','Vegetarian','Chickpeas, tomato, cucumber, lemon','Mix cooked chickpeas with chopped vegetables and lemon.'],['Masala oats','Vegetarian','Oats, milk or water, peas and spices','Cook oats with vegetables and mild spices.'],['Chicken tikka plate','Non-vegetarian','Chicken, yogurt, spices and salad','Marinate chicken in yogurt and spices, then grill thoroughly.'],['Egg bhurji toast','Non-vegetarian','Eggs, onion, tomato and whole-grain toast','Scramble eggs with sautéed vegetables and serve with toast.'],['Fish curry rice','Non-vegetarian','Fish, tomato, spices and rice','Simmer fish in a tomato-based curry until cooked through.'],['Chicken rice bowl','Non-vegetarian','Chicken, rice and mixed vegetables','Cook chicken fully and serve with rice and vegetables.']];
function recipesPage(){return `<section class="section"><div class="eyebrow">Simple meal inspiration</div><h2>Recipes</h2><p class="muted">Practical ideas to customise to your portions and taste.</p><div class="tagrow"><button class="active" onclick="filterRecipes('All',this)">All recipes</button><button onclick="filterRecipes('Vegetarian',this)">Vegetarian</button><button onclick="filterRecipes('Non-vegetarian',this)">Non-vegetarian</button></div><div class="grid" id="recipeGrid">${recipeCards('All')}</div></section>`}function recipeCards(f){return recipes.filter(r=>f==='All'||r[1]===f).map(r=>`<article class="card"><span class="pill">${r[1]}</span><h3>${r[0]}</h3><p><b>Ingredients:</b> ${r[2]}</p><p>${r[3]}</p><button class="btn secondary" onclick="addGroceries(${JSON.stringify(r[2])})">Add ingredients to grocery list</button></article>`).join('')}function filterRecipes(f,b){document.querySelectorAll('.tagrow button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('recipeGrid').innerHTML=recipeCards(f)}
function progressPage(){let logs=state.weights||[];return `<section class="section"><div class="eyebrow">Track trends, not perfection</div><h2>Progress</h2><p class="muted">Record weight measurements over time. Day-to-day fluctuations are normal.</p><div class="grid two"><div class="card"><div class="formgrid"><div class="field"><label>Date</label><input id="weightDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Weight (kg)</label><input id="weightValue" type="number" min="20" max="350" step="0.1" placeholder="65.0"></div></div><button class="btn" onclick="addWeight()">Save measurement</button></div><div class="card"><h3>Weight history</h3>${logs.length?`<div class="metric">${logs[logs.length-1].weight} kg</div><p class="small">Latest recorded weight</p>`:'<p class="muted">No measurements yet.</p>'}${logs.slice().reverse().map((w,i)=>`<div class="checkrow"><span style="flex:1">${esc(w.date)}</span><strong>${w.weight} kg</strong><button class="btn secondary" onclick="removeWeight(${logs.length-1-i})">×</button></div>`).join('')}</div></div></section>`}function addWeight(){let date=val('weightDate'),weight=num('weightValue');if(!date||weight<20||weight>350){alert('Enter a valid date and weight between 20 and 350 kg.');return}state.weights=state.weights||[];state.weights.push({date,weight});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}function removeWeight(i){state.weights.splice(i,1);save();render()}
function grocery(){let items=state.groceries||[];return `<section class="section"><div class="eyebrow">Make shopping easier</div><h2>Grocery list</h2><p class="muted">Add items yourself or send ingredients here from recipe ideas.</p><div class="grid two"><div class="card"><div class="toolbar"><input id="groceryInput" placeholder="Add an ingredient or grocery"><button class="btn" onclick="addGrocery()">Add</button></div><div class="actions"><button class="btn secondary" onclick="clearChecked()">Remove checked</button><button class="btn secondary" onclick="clearGroceries()">Clear list</button></div></div><div class="card"><h3>Your checklist</h3>${items.length?items.map((g,i)=>`<label class="checkrow ${g.done?'done':''}"><input type="checkbox" ${g.done?'checked':''} onchange="toggleGrocery(${i},this.checked)"><span style="flex:1">${esc(g.name)}</span><button type="button" class="btn secondary" onclick="removeGrocery(${i})">×</button></label>`).join(''):'<p class="muted">Your list is empty.</p>'}</div></div></section>`}function addGrocery(){let v=val('groceryInput').trim();if(!v)return;state.groceries=state.groceries||[];state.groceries.push({name:v,done:false});save();render()}function addGroceries(str){state.groceries=state.groceries||[];str.split(/,\s*/).forEach(x=>state.groceries.push({name:x,done:false}));save();alert('Ingredients added to grocery list.');}function toggleGrocery(i,v){state.groceries[i].done=v;save();render()}function removeGrocery(i){state.groceries.splice(i,1);save();render()}function clearChecked(){state.groceries=(state.groceries||[]).filter(x=>!x.done);save();render()}function clearGroceries(){if(confirm('Clear the entire grocery list?')){state.groceries=[];save();render()}}
function goalLabel(){return state.goalLabel||'Balanced eating'}function personalPlans(){let pref=state.preference||'Vegetarian',goal=state.goalLabel||'Balanced',target=Number(state.target||2000);return plans.filter(p=>(pref==='Vegan'?p.diet==='Vegetarian':pref==='All diets'||p.diet===pref)&&(goal==='Balanced'||p.goal===goal)).sort((a,b)=>Math.abs(a.calories-target)-Math.abs(b.calories-target)).slice(0,3)}function mealBreakdown(p){return [{name:'Breakfast',food:p.breakfast,k:Math.round(p.calories*.25),protein:Math.round(p.protein*.22)},{name:'Lunch',food:p.lunch,k:Math.round(p.calories*.35),protein:Math.round(p.protein*.36)},{name:'Snack',food:p.snack,k:Math.round(p.calories*.15),protein:Math.round(p.protein*.14)},{name:'Dinner',food:p.dinner,k:Math.round(p.calories*.25),protein:Math.round(p.protein*.28)}]}function nutritionHtml(p){return `<div class="meal-nutrition">${mealBreakdown(p).map(m=>`<span><b>${m.k} kcal</b>${m.protein}g protein · ${Math.round(m.k*.52/4)}g carbs* </span>`).join('')}</div><p class="small">*Per-meal macros are rough illustrative estimates inferred from the plan's daily totals, not recipe-level nutrient analysis.</p>`}function home(){let target=state.target||2000,entries=state.entries||[],total=entries.reduce((s,e)=>s+e.cal,0),fav=(state.favourites||[]).length,recs=personalPlans();return `<section class="hero"><div><div class="eyebrow">Your personal nutrition workspace</div><h1>Eat well. Feel good. <span style="color:var(--green)">Make it yours.</span></h1><p>Build a routine that fits your food preferences, energy needs and everyday life — with meal ideas, practical tracking and a clearer view of your progress.</p><div class="actions"><button class="btn" onclick="go('planner')">Build my meal plan →</button><button class="btn secondary" onclick="go('calculator')">Set my calorie goal</button></div></div><div class="heroart"><span class="emoji">🥗 🍲 🍎</span><strong>Progress comes from consistency, not perfection.</strong><span>Plan · Nourish · Reflect</span></div></section><div class="dashboard-hero"><div><div class="eyebrow">Your daily snapshot</div><h2>${total.toLocaleString()} <span style="font-size:16px;font-weight:600">/ ${target.toLocaleString()} kcal</span></h2><p>${Math.max(0,target-total).toLocaleString()} kcal remaining · ${fav} saved plan${fav===1?'':'s'}</p><div class="progress" style="background:#ffffff38;max-width:440px"><span style="width:${Math.min(100,total/target*100)}%;background:#dff28a"></span></div></div><div class="dashboard-mark">🌿</div></div><div class="quick-links"><button class="btn" onclick="go('diary')">＋ Log food</button><button class="btn secondary" onclick="go('progress')">Track progress</button><button class="btn secondary" onclick="go('plans')">Find a meal plan</button></div><section class="section"><div class="sectionhead"><div><h2>Picked for your goals</h2><p>Recommendations use your saved calorie target, diet preference and goal.</p></div></div><div class="grid">${recs.map(p=>`<article class="card"><span class="pill">${p.diet} · ${p.goal}</span><h3>${esc(p.name)}</h3><div class="stats"><div class="stat"><small>Calories</small><strong>${p.calories}</strong><small>kcal/day</small></div><div class="stat"><small>Protein</small><strong>${p.protein}g</strong><small>estimated/day</small></div></div><p>${esc(p.breakfast)} · ${esc(p.lunch)}</p><button class="btn" onclick="usePlan(${p.id});go('planner')">Use this plan</button></article>`).join('')}</div><div class="recommendation" style="margin-top:16px"><div class="eyebrow">Make recommendations yours</div><h3>What works best for you?</h3><div class="formgrid"><div class="field"><label>Diet preference</label><select id="homePref"><option>Vegetarian</option><option>Non-vegetarian</option><option>Vegan</option><option>All diets</option></select></div><div class="field"><label>Main goal</label><select id="homeGoal"><option>Balanced</option><option>Higher protein</option><option>Active lifestyle</option><option>Budget-friendly</option><option>Muscle support</option></select></div></div><button class="btn" onclick="savePreferences()">Update recommendations</button></div></section><section class="section"><div class="sectionhead"><div><h2>Your tools</h2><p>Everything you need, in one place.</p></div></div><div class="grid">${card('100 diet plans','Search by ingredient, diet type, calories and protein.','Browse plans','plans','01 · Discover')}${card('Meal planner','Save your daily meals and calorie target.','Open planner','planner','02 · Plan')}${card('Calorie calculator','Estimate daily energy needs from your details.','Calculate','calculator','03 · Personalise')}${card('Food diary','Log foods and compare intake with your goal.','Open diary','diary','04 · Track')}${card('Recipes','Practical meal inspiration and shopping ingredients.','Explore recipes','recipes','05 · Cook')}${card('Progress & groceries','Review weight history and shopping checklist.','Open tools','progress','06 · Review')}</div></section>`}function savePreferences(){state.preference=val('homePref');state.goalLabel=val('homeGoal');save();render()}function plansPage(){return `<section class="section"><div class="eyebrow">Discover meals that fit</div><h2>100 diet plans</h2><p class="muted">Search all meals and ingredients, then narrow by diet, goal, calorie range or protein.</p><div class="toolbar"><input id="search" placeholder="⌕ Search plan, meal or ingredient…" oninput="renderPlanCards()"><select id="diet" onchange="renderPlanCards()"><option>All diets</option><option>Vegetarian</option><option>Non-vegetarian</option></select><select id="goal" onchange="renderPlanCards()"><option>All goals</option><option>Balanced</option><option>Higher protein</option><option>Active lifestyle</option><option>Budget-friendly</option><option>Muscle support</option></select><select id="calFilter" onchange="renderPlanCards()"><option value="0">Any calories</option><option value="1800">Up to 1,800 kcal</option><option value="2200">Up to 2,200 kcal</option><option value="2600">Up to 2,600 kcal</option></select><select id="proteinFilter" onchange="renderPlanCards()"><option value="0">Any protein</option><option value="80">80g+ protein</option><option value="95">95g+ protein</option><option value="110">110g+ protein</option></select><select id="sort" onchange="renderPlanCards()"><option value="recommended">Recommended</option><option value="calories">Calories: low to high</option><option value="protein">Protein: high to low</option><option value="name">Name: A–Z</option></select></div><div class="sectionhead"><p id="count">100 plans</p><button class="btn secondary" onclick="resetPlanFilters()">Reset filters</button></div><div class="grid" id="plansGrid"></div></section>`}function resetPlanFilters(){['search','calFilter','proteinFilter'].forEach(id=>{let e=document.getElementById(id);if(e)e.value=id==='search'?'':'0'});['diet','goal','sort'].forEach(id=>{let e=document.getElementById(id);if(e)e.selectedIndex=0});renderPlanCards()}function renderPlanCards(){const root=document.getElementById('plansGrid');if(!root)return;const q=val('search').toLowerCase(),diet=val('diet'),goal=val('goal'),sort=val('sort'),maxCal=Number(val('calFilter')||0),minProtein=Number(val('proteinFilter')||0);let a=plans.filter(p=>(diet==='All diets'||p.diet===diet)&&(goal==='All goals'||p.goal===goal)&&(!maxCal||p.calories<=maxCal)&&(!minProtein||p.protein>=minProtein)&&[p.name,p.diet,p.goal,p.breakfast,p.lunch,p.snack,p.dinner].join(' ').toLowerCase().includes(q));if(sort==='calories')a.sort((x,y)=>x.calories-y.calories);if(sort==='protein')a.sort((x,y)=>y.protein-x.protein);if(sort==='name')a.sort((x,y)=>x.name.localeCompare(y.name));if(sort==='recommended'){let t=Number(state.target||2000);a.sort((x,y)=>Math.abs(x.calories-t)-Math.abs(y.calories-t))}document.getElementById('count').textContent=`Showing ${a.length} of 100 plans`;root.innerHTML=a.length?a.map(p=>`<article class="card plan-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="pill">${p.diet}</span><button class="btn secondary" style="padding:5px 9px" onclick="toggleFav(${p.id})">${(state.favourites||[]).includes(p.id)?'★ Saved':'☆ Save'}</button></div><h3>${esc(p.name)}</h3><div class="stats"><div class="stat"><small>Calories</small><strong>${p.calories}</strong><small>kcal/day</small></div><div class="stat"><small>Protein</small><strong>${p.protein}g</strong><small>estimated/day</small></div></div><div class="meals">${[['Breakfast',p.breakfast],['Lunch',p.lunch],['Snack',p.snack],['Dinner',p.dinner]].map(m=>`<div class="meal"><b>${m[0]}</b>${esc(m[1])}</div>`).join('')}</div><details><summary style="cursor:pointer;color:var(--green);font-weight:800">View estimated meal nutrition</summary>${nutritionHtml(p)}</details><p class="small">${esc(p.note)}</p><div class="actions"><button class="btn" onclick="usePlan(${p.id});go('planner')">Use this plan</button></div></article>`).join(''):'<div class="empty">No plans match those filters. Try widening your calorie or protein range.</div>'}function planner(){let m=state.planMeals||{},p=state.activePlan;return `<section class="section"><div class="eyebrow">Build a routine that works</div><h2>Meal planner</h2><p class="muted">Choose your food preference, set a daily target and save your meal outline.</p><div class="grid two"><div class="card"><div class="formgrid"><div class="field"><label>Diet preference</label><select id="pref"><option>Vegetarian</option><option>Non-vegetarian</option><option>Vegan</option><option>All diets</option></select></div><div class="field"><label>Daily calorie goal</label><input id="plannerTarget" type="number" min="800" max="6000" value="${state.target||2000}"></div></div>${['Breakfast','Lunch','Snack','Dinner'].map(k=>`<div class="field"><label>${k}</label><input id="meal${k}" value="${esc(m[k]||'')}" placeholder="Add a meal idea"></div>`).join('')}<div class="actions"><button class="btn" onclick="savePlanner()">Save daily plan</button><button class="btn secondary" onclick="go('plans')">Choose from 100 plans</button></div></div><div class="card"><span class="pill">Your saved plan</span><h3>${p?esc(p.name):'Start with a plan that fits'}</h3><p>${p?`${p.calories} kcal · ${p.protein} g estimated protein`:'Choose a preset or add your own meals.'}</p>${p?nutritionHtml(p):'<p class="muted">Your recommendations are based on saved preferences and calorie target.</p>'}<div class="notice">Meal nutrition figures are approximate. Use ingredient labels and portion sizes for more precise tracking.</div></div></div></section>`}function savePlanner(){state.target=Math.max(800,Math.min(6000,num('plannerTarget')));state.preference=val('pref');state.planMeals={Breakfast:val('mealBreakfast'),Lunch:val('mealLunch'),Snack:val('mealSnack'),Dinner:val('mealDinner')};save();alert('Your meal plan has been saved in this browser.')}function progressPage(){let logs=state.weights||[],target=state.target||2000,entries=state.entries||[],total=entries.reduce((s,e)=>s+e.cal,0),latest=logs.length?logs[logs.length-1]:null,first=logs.length?logs[0]:null,change=latest&&first?Math.round((latest.weight-first.weight)*10)/10:0;return `<section class="section"><div class="eyebrow">Your wellness dashboard</div><h2>Progress & consistency</h2><p class="muted">Follow the trend over time, celebrate small wins and keep goals flexible.</p><div class="dashboard-hero"><div><div class="eyebrow">Today's nutrition</div><h2>${total.toLocaleString()} / ${target.toLocaleString()} kcal</h2><p>${Math.round(total/target*100)}% of daily calorie target logged</p><div class="progress" style="background:#ffffff38;max-width:440px"><span style="width:${Math.min(100,total/target*100)}%;background:#dff28a"></span></div></div><div class="dashboard-mark">📈</div></div><div class="card" style="margin-top:14px"><h3>Today's macros</h3><div class="stats"><div class="stat"><small>Protein</small><strong>${entries.reduce((s,e)=>s+Number(e.protein||0),0).toFixed(1)} g</strong></div><div class="stat"><small>Carbohydrates</small><strong>${entries.reduce((s,e)=>s+Number(e.carbs||0),0).toFixed(1)} g</strong></div><div class="stat"><small>Fat</small><strong>${entries.reduce((s,e)=>s+Number(e.fat||0),0).toFixed(1)} g</strong></div><div class="stat"><small>Fiber</small><strong>${entries.reduce((s,e)=>s+Number(e.fiber||0),0).toFixed(1)} g</strong></div></div></div><div class="grid"><div class="card"><span class="small">Latest weight</span><div class="metric">${latest?latest.weight+' kg':'—'}</div><p>${latest?esc(latest.date):'Add your first measurement below'}</p></div><div class="card"><span class="small">Change across records</span><div class="metric">${logs.length>1?(change>0?'+':'')+change+' kg':'—'}</div><p>${logs.length>1?'First to latest entry; not a daily change':'Add at least two measurements'}</p></div><div class="card"><span class="small">Diary consistency</span><div class="metric">${entries.length}</div><p>food entries currently logged</p></div></div><div class="grid two" style="margin-top:15px"><div class="card"><h3>Weight trend</h3>${logs.length?`<div class="chart-wrap"><div class="chart-bars">${logs.slice(-10).map(w=>{let min=Math.min(...logs.map(x=>x.weight)),max=Math.max(...logs.map(x=>x.weight)),height=max===min?55:20+(w.weight-min)/(max-min)*80;return `<div class="chart-bar" style="height:${height}%" title="${w.date}: ${w.weight} kg"><span>${esc(w.date.slice(5))}</span></div>`}).join('')}</div></div><p class="small">Last ${Math.min(10,logs.length)} records · measurements can fluctuate naturally.</p>`:'<p class="muted">Your chart will appear after you save measurements.</p>'}<div class="formgrid"><div class="field"><label>Date</label><input id="weightDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Weight (kg)</label><input id="weightValue" type="number" min="20" max="350" step="0.1" placeholder="e.g. 65.0"></div></div><button class="btn" onclick="addWeight()">Save measurement</button></div><div class="card"><h3>Measurement history</h3>${logs.length?logs.slice().reverse().map((w,i)=>`<div class="checkrow"><span style="flex:1">${esc(w.date)}</span><strong>${w.weight} kg</strong><button class="btn secondary" onclick="removeWeight(${logs.length-1-i})">×</button></div>`).join(''):'<p class="muted">No measurements yet. Add one to start your trend.</p>'}<div class="notice">Focus on habits, energy and wellbeing alongside weight. This dashboard is for personal tracking, not diagnosis or treatment.</div></div></div></section>`}function render(){setNav();let p=pageName();let html=({home,plans:plansPage,planner,calculator,diary,recipes:recipesPage,progress:progressPage,grocery})[p]||home;document.getElementById('main').innerHTML=html();if(p==='plans')renderPlanCards();if(p==='calculator'){if(state.profile){let x=state.profile;document.getElementById('gender').value=x.gender||'male';document.getElementById('activity').value=x.activity||1.2}if(state.suggested){document.getElementById('bmr').textContent='—';document.getElementById('tdee').textContent='—';document.getElementById('suggested').textContent=state.suggested.toLocaleString()}}if(p==='home'){if(document.getElementById('homePref'))document.getElementById('homePref').value=state.preference||'Vegetarian';if(document.getElementById('homeGoal'))document.getElementById('homeGoal').value=state.goalLabel||'Balanced'}}window.addEventListener('hashchange',render);render();
</script></body></html>
